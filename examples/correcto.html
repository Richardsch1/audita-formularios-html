<!doctype html>
<html lang="es-PE">
<head><meta charset="utf-8"><title>Ejemplo ficticio de formulario</title></head>
<body>
  <form>
    <label for="zona">Zona general ficticia</label>
    <input id="zona" name="zona" aria-describedby="ayuda">
    <p id="ayuda">No incluyas una dirección exacta o datos personales.</p>
    <fieldset>
      <legend>Tipo de asunto ficticio</legend>
      <label><input type="radio" name="tipo" value="agua"> Agua</label>
      <label><input type="radio" name="tipo" value="otro"> Otro</label>
    </fieldset>
    <button type="button">Revisar ejemplo</button>
  </form>
</body>
</html>
